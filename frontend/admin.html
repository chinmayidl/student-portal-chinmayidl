<!DOCTYPE html>
<html>

<title>Admin</title>

</head>

<body>

<nav>

<div class="container">

<h1>Admin Dashboard</h1>

<table border="1" width="100%">
<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>Message</th>
</tr>
</thead>

<tbody id="data"></tbody>

</table>

</div>

<script>

fetch("http://localhost:5000/getData")
.then(res=>res.json())
.then(data=>{

let html="";

data.forEach(d=>{
html+=`
<tr>
<td>${d.name}</td>
<td>${d.email}</td>
<td>${d.message}</td>
</tr>
`;
});

document.getElementById("data").innerHTML=html;

});

</script>

</body>
</html>
