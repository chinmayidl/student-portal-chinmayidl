<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<form onsubmit="login(event)">
<input type="text" id="user">
<input type="password" id="pass">
<button>Login</button>
</form>
<script>
function login(e){
e.preventDefault();
if(user.value=="admin" && pass.value=="123"){
alert("Success")
}else{
alert("Invalid")
}
}
</script>
</body>
</html>
